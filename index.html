<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Atlas — OpenStreetMap infrastructure</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  #panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: #fff; padding: 10px 14px; border-radius: 8px;
    box-shadow: 0 1px 6px rgba(0,0,0,.4); font-size: 13px; line-height: 1.5;
    max-width: 240px;
  }
  #panel button { display: block; width: 100%; margin-top: 6px; padding: 6px; cursor: pointer; }
  #status { color: #555; }
  .legend b { display: inline-block; width: 12px; height: 4px; margin-right: 4px; vertical-align: middle; }
  .legend span { display: block; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>Power Atlas</b>
  <div class="legend">
    <span><b style="background:#d7301f"></b>≥ 345 kV</span>
    <span><b style="background:#fe9929"></b>161–344 kV</span>
    <span><b style="background:#3690c0"></b>69–160 kV</span>
    <span><b style="background:#969696"></b>&lt; 69 kV / other</span>
    <span><span class="dot" style="background:#7a0177"></span>Substation</span>
    <span><span class="dot" style="background:#08304b"></span>Power plant</span>
    <span><span class="dot" style="background:#4d4d4d"></span>Transformer</span>
  </div>
  <div id="status">Loading…</div>
  <button id="reload">Reload this area</button>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([41.13953, -80.84225], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);
const layer = L.layerGroup().addTo(map);
const status = document.getElementById('status');

const lineColor = v => v >= 345 ? '#d7301f' : v >= 161 ? '#fe9929' : v >= 69 ? '#3690c0' : '#969696';
const props = t => ({
  name: t.tags.name, voltage: t.tags.voltage, operator: t.tags.operator,
  source: t.tags['plant:source'], power: t.tags.power
});
const popup = p =>
  '<b>' + (p.name || '(' + p.power + ')') + '</b><br>' +
  (p.voltage ? 'Voltage: ' + p.voltage + ' V<br>' : '') +
  (p.source ? 'Source: ' + p.source + '<br>' : '') +
  (p.operator ? 'Operator: ' + p.operator : '');

// Ways come as node lists; make GeoJSON line or point-at-centroid
function toFeature(el) {
  if (el.type === 'node')
    return { type: 'Feature', geometry: { type: 'Point', coordinates: [el.lon, el.lat] }, properties: props(el) };
  const pts = el.geometry.map(g => [g.lon, g.lat]);
  const isLine = el.tags.power === 'line' || el.tags.power === 'cable';
  const geom = isLine
    ? { type: 'LineString', coordinates: pts }
    : { type: 'Point', coordinates: pts.reduce((a, p) => [a[0] + p[0] / pts.length, a[1] + p[1] / pts.length], [0, 0]) };
  return { type: 'Feature', geometry: geom, properties: props(el) };
}

let lastB = null;
async function load() {
  lastB = map.getBounds();
  status.textContent = 'Loading…';
  layer.clearLayers();
  const b = map.getBounds();
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].join(',');
  const q = `[out:json][timeout:60];(
    way["power"~"^(line|cable)$"](${bbox});
    nwr["power"~"^(substation|plant|transformer)$"](${bbox});
  );out geom;`;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST', body: 'data=' + encodeURIComponent(q),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    for (const el of data.elements) {
      const f = toFeature(el);
      if (!f.geometry.coordinates.length) continue;
      const p = f.properties;
      if (f.geometry.type === 'LineString') {
        L.geoJSON(f, {
          style: { color: lineColor(Math.max(...String(p.voltage || '').split(';').map(Number).filter(n => n > 0), 0)), weight: 3 }
        }).bindPopup(popup(p)).addTo(layer);
      } else {
        const color = p.power === 'substation' ? '#7a0177' : p.power === 'plant' ? '#08304b' : '#4d4d4d';
        L.circleMarker([f.geometry.coordinates[1], f.geometry.coordinates[0]],
          { radius: p.power === 'substation' ? 6 : 4, color, fillOpacity: .8 })
          .bindPopup(popup(p)).addTo(layer);
      }
    }
    status.textContent = data.elements.length + ' features (© OpenStreetMap)';
  } catch (e) {
    status.textContent = 'Failed: ' + e.message + ' — Overpass may be busy, retry in a moment.';
  }
}

document.getElementById('reload').onclick = load;
// auto-reload when the view grows beyond the last-loaded area (padded 25%)
map.on('moveend', () => { if (!lastB || !lastB.pad(0.25).contains(map.getCenter())) load(); });
load();
</script>
</body>
</html>
